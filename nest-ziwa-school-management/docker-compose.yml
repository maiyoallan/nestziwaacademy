services:
  db:
    image: postgres:16-alpine
    container_name: nest-ziwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nest_ziwa
      POSTGRES_USER: nestziwa
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5433:5432"
    volumes:
      - nest_ziwa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestziwa -d nest_ziwa"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  nest_ziwa_data:
